<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-labelledby="tia-logo-title">
  <title id="tia-logo-title">TIA — Accessories &amp; More</title>
  <!--
    Brand placeholder wordmark. Seeded catalog records (scripts/seed.ts)
    point at this path until the store owner uploads real photography;
    the storefront detects it (lib/config/demoImages.ts) and shows demo
    imagery instead, so this file is rarely rendered directly.
  -->
  <rect width="320" height="80" fill="none" />
  <text x="160" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="10" fill="#131a2e">TIA</text>
  <text x="160" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="4" fill="#131a2e">ACCESSORIES &amp; MORE</text>
</svg>
