name: CI

# T235 (research.md §14, §22): gates every merge on typecheck, lint,
# production build, the full Vitest suite (unit + Firebase-Emulator-backed
# integration, including the Phase 16 security-rules tests), and the full
# Playwright e2e suite across the mobile/tablet/desktop device matrix, in
# both locales where a spec parameterizes on locale.
#
# Lighthouse CI (also named in T235) is deliberately NOT included here: a
# meaningful Lighthouse run needs a real deployed preview URL, which this
# project has no deployment target for yet (the same honest gap documented
# for T201 and T228). Wiring it in is a small addition once a preview
# deployment exists — a `lhci autorun --collect.url=<preview-url>` step
# added to this workflow, gated on the same triggers below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No workflow-level env: each job declares exactly the environment it needs.
# Emulator variables (FIRESTORE_EMULATOR_HOST etc.) exist ONLY in the jobs
# that start the Firebase Local Emulator Suite. The production build must
# never see them — with them set, any build-time Firestore access tries to
# reach an emulator that does not exist in that job (ECONNREFUSED :8080).

jobs:
  static-checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    # Production-like build environment: public client config placeholders
    # only, emulators OFF, no emulator hosts, no Admin credentials. Any
    # build-time Firestore access therefore fails loudly instead of silently
    # depending on a database.
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "false"
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDEMO0000000000000000000000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-elora.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-elora
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-elora.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src tests playwright.config.ts --max-warnings=0
      - name: Guard — no emulator configuration in the production build
        run: |
          if env | grep -E '^(FIRESTORE|FIREBASE_AUTH|FIREBASE_STORAGE|FIREBASE_DATABASE)_EMULATOR_HOST=' ; then
            echo "::error::Emulator variables must not be set for the production build."
            exit 1
          fi
      - run: npm run build

  unit-and-integration:
    name: Vitest (unit + Firebase Emulator integration)
    runs-on: ubuntu-latest
    # Firebase Local Emulator Suite configuration (demo project only).
    env:
      FIREBASE_PROJECT_ID: demo-elora
      GCLOUD_PROJECT: demo-elora
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDEMO0000000000000000000000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-elora.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-elora
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-elora.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_BOOTSTRAP_EMAIL: admin@elora.local
      ADMIN_BOOTSTRAP_PASSWORD: DevAdminPass123CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run test:unit
      - name: Integration tests against the Firebase Local Emulator Suite
        run: firebase emulators:exec --project demo-elora "npm run test:integration"

  e2e:
    # One runner per device project, rather than all 700 tests in a single
    # opaque job. Each entry is fully self-contained — its own emulators,
    # its own seed, its own production E2E server — so a device's failure
    # neither blocks nor is blocked by the others, its report is its own
    # artifact, and a WebKit project no longer shares two vCPUs with a
    # Chromium project and the server. Separate runners mean the fixed
    # emulator and 3100 ports never collide.
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One device failing must not cancel the evidence from the other four.
      fail-fast: false
      matrix:
        include:
          - project: mobile
            browser: chromium
          - project: mobile-ios
            browser: webkit
          - project: tablet
            browser: webkit
          - project: laptop
            browser: chromium
          - project: desktop
            browser: chromium
    # Firebase Local Emulator Suite configuration (demo project only).
    env:
      FIREBASE_PROJECT_ID: demo-elora
      GCLOUD_PROJECT: demo-elora
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDEMO0000000000000000000000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-elora.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-elora
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-elora.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_BOOTSTRAP_EMAIL: admin@elora.local
      ADMIN_BOOTSTRAP_PASSWORD: DevAdminPass123CI
      # Test-only, and only ever used against the demo-elora emulator — never
      # a production secret. Without it the E2E server falls back to an
      # insecure development value and warns on every request.
      CART_COOKIE_SECRET: ci-e2e-emulator-only-cart-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm install -g firebase-tools
      # `playwright.config.ts` builds and starts the E2E server itself (on CI
      # that is `next build && next start` on port 3100, in `.next-e2e`), so
      # the emulators must already be up: the build renders pages that read
      # Firestore.
      - name: Seed the emulator and run this device's Playwright project
        run: |
          firebase emulators:start --project demo-elora &
          npx wait-on tcp:8080 tcp:9099 tcp:9199
          npm run seed
          npm run create-admin
          npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
